services:
  backend:
    build: ./Backend
    ports:
      - "8000:8000"
    env_file: ./Backend/.env
    volumes:
      - ./Backend/app:/code/app
      - ./Backend/tests:/code/tests
    restart: unless-stopped

  frontend:
    build: ./Frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
